<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة إدارة الصيدلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --navy:#0f3a73; --navy-2:#0c2f5c; --blue:#1768c2; --blue-dark:#0f52a0;
    --ink:#122040; --gray:#6b7280; --gray-light:#f2f5f9;
    --line:rgba(18,32,64,0.09); --line-strong:rgba(18,32,64,0.18);
    --page-bg:#eef2f8; --white:#fff; --danger:#e6483a; --shell-w:1100px;
    --in-stock:#16a34a; --out-stock:#dc2626;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--page-bg); color:var(--ink); font-family:'Cairo',sans-serif;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{max-width:100%; display:block;}
  input,select,textarea{font-family:inherit;}

  .topbar{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color:#fff;
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;}
  .logo-badge{width:36px; height:36px; border-radius:10px; background:#fff; color:var(--blue); display:flex; align-items:center; justify-content:center;}
  .logo-badge svg{width:19px; height:19px;}

  .wrap{max-width:var(--shell-w); margin:0 auto; padding:24px 16px 60px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:800;}
  .btn.solid{background:var(--navy); color:#fff;}
  .btn.accent{background:var(--blue); color:#fff;}
  .btn.ghost{border:1.5px solid var(--line-strong); color:var(--gray);}
  .btn.danger{border:1.5px solid rgba(230,72,58,.4); color:var(--danger);}
  .btn.small{padding:8px 14px; font-size:12px;}
  .btn.wide{width:100%;}

  .login-box{max-width:400px; margin:60px auto 0; background:var(--white); padding:28px; border-radius:16px; box-shadow:0 10px 40px rgba(15,25,45,.08);}
  .login-box h2{font-size:22px; font-weight:900; margin-bottom:6px;}
  .login-box p{color:var(--gray); font-size:13.5px; margin-bottom:22px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--gray); margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--gray-light); border:1.5px solid var(--line-strong); color:var(--ink);
    padding:12px 14px; font-family:inherit; font-size:14px; outline:none; border-radius:10px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--blue);}
  .field textarea{min-height:90px; resize:vertical;}
  .error-msg{color:var(--danger); font-size:12.5px; margin-top:8px; display:none; font-weight:700;}

  .field-scientific input{
    border:2px solid var(--blue);
    background:#eef6ff;
    font-weight:700;
    color:var(--blue-dark);
  }

  .stock-checkbox-wrap{
    display:flex; align-items:center; gap:12px; background:#fff; padding:12px;
    border-radius:10px; border:2px dashed var(--line-strong); margin-bottom:16px;
  }
  .stock-status-badge{
    font-size:13px; font-weight:900; padding:4px 12px; border-radius:6px; text-transform:uppercase;
  }
  .stock-status-badge.available{ background:#dcfce7; color:var(--in-stock); }
  .stock-status-badge.unavailable{ background:#fee2e2; color:var(--out-stock); }

  .admin-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .admin-header h2{font-size:21px; font-weight:900;}
  .admin-panel{border:1px solid var(--line); padding:20px; border-radius:16px; background:var(--white); margin-bottom:20px;}
  .admin-panel h3{font-size:16.5px; font-weight:900; margin-bottom:16px;}
  .two-col{display:grid; grid-template-columns:1fr; gap:0 16px;}

  .image-slots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px;}
  .image-slot{
    aspect-ratio:1; border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
    color:var(--gray); font-size:20px; overflow:hidden; position:relative; border-radius:10px; background:var(--gray-light);
  }
  .image-slot img{width:100%; height:100%; object-fit:contain; padding:4px;}
  .image-slot input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}

  .admin-list .row{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .admin-list .row img{width:44px; height:52px; object-fit:contain; background:var(--gray-light); border-radius:8px; padding:3px;}
  .admin-list .row .rinfo{flex:1; min-width:160px;}
  .admin-list .row .rinfo .rn{font-size:14px; font-weight:700;}
  .admin-list .row .rinfo .sci{font-size:11.5px; color:var(--blue-dark); font-weight:700; margin-top:2px;}
  .admin-list .row .rinfo .rc{font-size:11.5px; color:var(--gray); margin-top:2px;}
  .admin-list .row .rinfo .rp{font-size:12.5px; color:var(--blue-dark); font-weight:800; margin-top:2px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(var(--shell-w) - 32px);
    background:var(--ink); color:#fff; padding:12px 20px; font-size:13.5px; font-weight:700; z-index:99; display:none; border-radius:10px;
  }
  .toast.show{display:block;}

  @media (min-width:800px){
    .two-col{grid-template-columns:1fr 1fr;}
    #dashboard{display:grid; grid-template-columns:1fr 1.2fr; gap:24px; align-items:start;}
    #dashboard .admin-header{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg></div>
    <span id="topbarTitle">لوحة إدارة الصيدلية</span>
  </div>
  <a href="index.html" class="btn ghost small" style="color:#fff; border-color:rgba(255,255,255,.35);">عرض المتجر</a>
</header>

<div class="wrap">

  <div class="login-box" id="loginBox">
    <h2>دخول الإدارة</h2>
    <p>هذه اللوحة خاصة بصاحب الصيدلية فقط.</p>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="adminEmail"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="adminPassword"></div>
    <button class="btn solid wide" id="loginBtn">دخول</button>
    <p class="error-msg" id="loginError"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="admin-header">
      <h2 id="dashHeaderTitle">إدارة الأدوية والمنتجات</h2>
      <button class="btn ghost small" id="logoutBtn">خروج</button>
    </div>

    <div class="admin-panel">
      <h3 id="formTitle">إضافة دواء / منتج جديد</h3>

      <div class="field">
        <label>الصور (حتى 4 صور)</label>
        <div class="image-slots" id="imageSlots"></div>
      </div>

      <div class="two-col">
        <div class="field"><label>الاسم التجاري</label><input type="text" id="pTitle" placeholder="مثال: بانادول"></div>
        <div class="field">
          <label>القسم</label>
          <select id="pCategory"></select>
        </div>
      </div>

      <div class="field field-scientific">
        <label>الاسم العلمي (Active Ingredient) ★</label>
        <input type="text" id="pScientific" placeholder="مثال: Paracetamol">
      </div>

      <div class="two-col">
        <div class="field"><label>التركيز (Strength)</label><input type="text" id="pStrength" placeholder="مثال: 500 mg"></div>
        <div class="field"><label>الشركة المصنعة</label><input type="text" id="pManufacturer" placeholder="مثال: GSK"></div>
      </div>

      <div class="field"><label>الوصف</label><textarea id="pDesc" placeholder="دواعي الاستعمال، الجرعة، ملاحظات..."></textarea></div>

      <div class="two-col">
        <div class="field"><label>السعر الحالي (د.ل)</label><input type="text" id="pPrice" inputmode="decimal" placeholder="4.50"></div>
        <div class="field"><label>السعر قبل الخصم (اختياري)</label><input type="text" id="pOriginalPrice" inputmode="decimal"></div>
      </div>

      <div class="field"><label>العبوة / الكمية</label><input type="text" id="pPack" placeholder="مثال: 20 قرص، 100 مل، 14 كبسولة"></div>

      <div class="stock-checkbox-wrap">
        <input type="checkbox" id="pInStock" checked style="width:20px; height:20px; cursor:pointer;">
        <label for="pInStock" style="margin:0; cursor:pointer; font-weight:800; flex:1;">حالة المنتج بالمخزون:</label>
        <span id="stockStatusText" class="stock-status-badge available">متوفر</span>
      </div>

      <button class="btn accent wide" id="publishBtn">نشر المنتج</button>
      <p class="error-msg" id="publishError"></p>
      <p style="margin-top:10px; display:none;" id="cancelEditWrap">
        <a href="#" id="cancelEditBtn" style="color:var(--gray); font-size:13px; font-weight:700;">إلغاء التعديل والبدء من جديد</a>
      </p>
    </div>

    <div class="admin-panel admin-list">
      <h3>المنتجات المنشورة</h3>
      <div id="adminProductsList"><p style="color:var(--gray); font-size:13px;">جاري التحميل...</p></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzLZxIGum-QQ4vEvGsaozAqDQDyUiW54k",
  authDomain: "as12-d6210.firebaseapp.com",
  projectId: "as12-d6210",
  storageBucket: "as12-d6210.firebasestorage.app",
  messagingSenderId: "490183773270",
  appId: "1:490183773270:web:d8a8ff4be981d20f0afff7"
};
const IMGBB_KEY = "d8ce52076bc29d3fd2691875d307c021";

/* نفس اسم الـ collection اللي تقرأ منه واجهة المتجر */
const COLLECTION_NAME = "pharmacyProducts";
const PHARMACIES_COLLECTION = "pharmacies";

const CATEGORY_NAMES = [
  "الأدوية العامة",
  "الأدوية الأمراض المزمنة",
  "الفيتامينات والمكملات",
  "العناية بالبشرة والشعر",
  "الأم والطفل",
  "مستلزمات وخفض حرارة",
  "المستلزمات الطبية",
  "العناية الشخصية"
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* بيانات الصيدلية صاحبة الحساب المسجّل دخوله حالياً */
let currentPharmacy = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}
function fmtPrice(p){
  const n = Number(p);
  return (isNaN(n) ? p : n.toFixed(2).replace(/\.00$/,'')) + ' د.ل';
}
function hasDiscount(p){
  const orig = Number(p.originalPrice), cur = Number(p.price);
  return orig > 0 && orig > cur;
}
async function uploadToImgbb(file){
  const base64 = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const form = new FormData();
  form.append('key', IMGBB_KEY);
  form.append('image', base64);
  const res = await fetch('https://api.imgbb.com/1/upload', { method:'POST', body: form });
  const data = await res.json();
  if(!data.success) throw new Error('فشل رفع الصورة');
  return data.data.url;
}

/* category select */
const catSelect = document.getElementById('pCategory');
catSelect.innerHTML = CATEGORY_NAMES.map(c=>`<option value="${c}">${c}</option>`).join('');

/* شارة التوفر */
const stockCheckbox = document.getElementById('pInStock');
const stockStatusText = document.getElementById('stockStatusText');
stockCheckbox.addEventListener('change', (e)=>{
  if(e.target.checked){
    stockStatusText.textContent = 'متوفر';
    stockStatusText.className = 'stock-status-badge available';
  } else {
    stockStatusText.textContent = 'غير متوفر';
    stockStatusText.className = 'stock-status-badge unavailable';
  }
});

/* auth */
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(err){
    errEl.textContent = 'بيانات الدخول غير صحيحة';
    errEl.style.display = 'block';
  }
});
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await auth.signOut();
});

auth.onAuthStateChanged(async user=>{
  if(user){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    /* نجيب بيانات الصيدلية صاحبة هذا الحساب */
    try{
      const doc = await db.collection(PHARMACIES_COLLECTION).doc(user.uid).get();
      if(doc.exists){
        currentPharmacy = { id: doc.id, ...doc.data() };
        document.getElementById('topbarTitle').textContent = 'لوحة إدارة ' + (currentPharmacy.name || '');
        document.getElementById('dashHeaderTitle').textContent = 'إدارة منتجات ' + (currentPharmacy.name || '');
      } else {
        currentPharmacy = null;
        showToast('تنبيه: لا يوجد ملف صيدلية مرتبط بهذا الحساب، تواصل مع الدعم الفني');
      }
    }catch(err){
      currentPharmacy = null;
    }

    watchProducts();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    currentPharmacy = null;
  }
});

/* products state */
let allProducts = [];
function watchProducts(){
  const uid = auth.currentUser ? auth.currentUser.uid : null;
  if(!uid) return;
  /* كل صيدلية تشوف فقط منتجاتها هي (pharmacyId == uid حسابها) */
  db.collection(COLLECTION_NAME)
    .where('pharmacyId', '==', uid)
    .orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      allProducts = [];
      snap.forEach(doc=> allProducts.push({ id: doc.id, ...doc.data() }));
      renderAdminList();
    }, err=>{
      document.getElementById('adminProductsList').innerHTML =
        '<p style="color:var(--danger); font-size:13px; direction:ltr; text-align:right; word-break:break-word;">تعذّر تحميل المنتجات.<br><b>رسالة الخطأ الحقيقية:</b><br>' + err.message + '<br><br><b>الكود:</b> ' + err.code + '</p>';
    });
}

/* image slots */
const pendingImages = [null, null, null, null];
let editingProductId = null;

function renderImageSlots(){
  const wrap = document.getElementById('imageSlots');
  wrap.innerHTML = pendingImages.map((img, i)=>{
    const src = img ? (img.preview || img.existingUrl) : '';
    return `<div class="image-slot">${src ? `<img src="${src}">` : '+'}<input type="file" accept="image/*" data-i="${i}"></div>`;
  }).join('');
  wrap.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const i = Number(e.target.dataset.i);
      pendingImages[i] = { file, preview: URL.createObjectURL(file) };
      renderImageSlots();
    });
  });
}
renderImageSlots();

function resetForm(){
  editingProductId = null;
  document.getElementById('pTitle').value = '';
  document.getElementById('pScientific').value = '';
  document.getElementById('pStrength').value = '';
  document.getElementById('pManufacturer').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pOriginalPrice').value = '';
  document.getElementById('pCategory').value = CATEGORY_NAMES[0];
  document.getElementById('pPack').value = '';
  stockCheckbox.checked = true;
  stockCheckbox.dispatchEvent(new Event('change'));
  pendingImages.fill(null);
  renderImageSlots();
  document.getElementById('formTitle').textContent = 'إضافة دواء / منتج جديد';
  document.getElementById('publishBtn').textContent = 'نشر المنتج';
  document.getElementById('cancelEditWrap').style.display = 'none';
}

function startEdit(id){
  const p = allProducts.find(x=>x.id===id);
  if(!p) return;
  editingProductId = id;
  document.getElementById('pTitle').value = p.title || '';
  document.getElementById('pScientific').value = p.scientific || '';
  document.getElementById('pStrength').value = p.strength || '';
  document.getElementById('pManufacturer').value = p.manufacturer || '';
  document.getElementById('pDesc').value = p.description || '';
  document.getElementById('pPrice').value = p.price || '';
  document.getElementById('pOriginalPrice').value = p.originalPrice || '';
  document.getElementById('pCategory').value = p.category || CATEGORY_NAMES[0];
  document.getElementById('pPack').value = p.pack || p.packSize || '';
  stockCheckbox.checked = p.inStock !== false;
  stockCheckbox.dispatchEvent(new Event('change'));
  pendingImages.fill(null);
  (p.imageUrls || []).slice(0,4).forEach((url, i)=>{ pendingImages[i] = { existingUrl: url }; });
  renderImageSlots();
  document.getElementById('formTitle').textContent = 'تعديل المنتج';
  document.getElementById('publishBtn').textContent = 'حفظ التعديلات';
  document.getElementById('cancelEditWrap').style.display = 'block';
  document.querySelector('.admin-panel').scrollIntoView({ behavior:'smooth', block:'start' });
}
document.getElementById('cancelEditBtn').addEventListener('click', e=>{ e.preventDefault(); resetForm(); });

document.getElementById('publishBtn').addEventListener('click', async ()=>{
  const uid = auth.currentUser ? auth.currentUser.uid : null;
  if(!uid) return;

  const title = document.getElementById('pTitle').value.trim();
  const scientific = document.getElementById('pScientific').value.trim();
  const strength = document.getElementById('pStrength').value.trim();
  const manufacturer = document.getElementById('pManufacturer').value.trim();
  const description = document.getElementById('pDesc').value.trim();
  const price = document.getElementById('pPrice').value.trim();
  const originalPrice = document.getElementById('pOriginalPrice').value.trim();
  const category = document.getElementById('pCategory').value;
  const pack = document.getElementById('pPack').value.trim();
  const inStock = stockCheckbox.checked;
  const errEl = document.getElementById('publishError');
  errEl.style.display = 'none';

  if(!title || !price){
    errEl.textContent = 'اكتب اسم المنتج والسعر على الأقل';
    errEl.style.display = 'block';
    return;
  }
  if(originalPrice && Number(originalPrice) <= Number(price)){
    errEl.textContent = 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي';
    errEl.style.display = 'block';
    return;
  }
  const filledSlots = pendingImages.filter(Boolean);
  if(filledSlots.length === 0){
    errEl.textContent = 'أضف صورة واحدة على الأقل';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('publishBtn');
  const originalBtnText = btn.textContent;
  btn.textContent = 'جاري الحفظ...';
  btn.disabled = true;

  try{
    const imageUrls = [];
    for(const item of pendingImages){
      if(!item) continue;
      if(item.existingUrl){ imageUrls.push(item.existingUrl); continue; }
      const url = await uploadToImgbb(item.file);
      imageUrls.push(url);
    }
    const data = {
      title, scientific, strength, manufacturer, description,
      price, originalPrice, category, pack, imageUrls, inStock,
      pharmacyId: uid /* ربط المنتج بصاحبه */
    };
    if(editingProductId){
      await db.collection(COLLECTION_NAME).doc(editingProductId).update(data);
      showToast('تم حفظ التعديلات');
    } else {
      await db.collection(COLLECTION_NAME).add({ ...data, createdAt: Date.now() });
      showToast('تم نشر المنتج بنجاح');
    }
    resetForm();
  }catch(err){
    errEl.textContent = 'حدث خطأ أثناء الحفظ، حاول مرة أخرى';
    errEl.style.display = 'block';
    btn.textContent = originalBtnText;
  }finally{
    btn.disabled = false;
    if(!editingProductId) btn.textContent = 'نشر المنتج';
  }
});

function renderAdminList(){
  const wrap = document.getElementById('adminProductsList');
  if(allProducts.length === 0){
    wrap.innerHTML = '<p style="color:var(--gray); font-size:13px;">لا توجد منتجات منشورة بعد</p>';
    return;
  }
  wrap.innerHTML = allProducts.map(p=>`
    <div class="row" data-id="${p.id}">
      <img src="${(p.imageUrls&&p.imageUrls[0])||''}">
      <div class="rinfo">
        <div class="rn">${p.title||''} ${p.inStock===false ? '<span style="color:var(--gray); font-size:11px;">(نفدت)</span>' : ''}</div>
        ${p.scientific ? `<div class="sci">${p.scientific}${p.strength ? ' — ' + p.strength : ''}</div>` : ''}
        <div class="rc">${p.category||''}${(p.pack||p.packSize) ? ' · ' + (p.pack||p.packSize) : ''}${p.manufacturer ? ' · ' + p.manufacturer : ''}</div>
        <div class="rp">${fmtPrice(p.price)}${hasDiscount(p) ? ` <span style="color:var(--gray); text-decoration:line-through; font-size:11px;">${fmtPrice(p.originalPrice)}</span>` : ''}</div>
      </div>
      <button class="btn ghost small edit-btn">تعديل</button>
      <button class="btn danger small delete-btn">حذف</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startEdit(btn.closest('.row').dataset.id));
  });
  wrap.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.closest('.row').dataset.id;
      if(!confirm('متأكد من حذف هذا المنتج؟')) return;
      await db.collection(COLLECTION_NAME).doc(id).delete();
      showToast('تم الحذف');
    });
  });
}
</script>
</body>
</html>
