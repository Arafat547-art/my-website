<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>صيدليتي — Pharmacy Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --black:#101012;
    --white:#ffffff;
    --accent:#0d9488;
    --accent-dark:#0f766e;
    --gray:#6b6b70;
    --gray-light:#f2f2f3;
    --line: rgba(16,16,18,0.08);
    --line-strong: rgba(16,16,18,0.16);
    --page-bg:#e9e9ea;
    --shell-w: 1200px;
    --in-stock: #16a34a;
    --out-stock: #dc2626;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--page-bg); color:var(--black); font-family:'Cairo', sans-serif;
    padding-bottom: 60px; min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  
  header{
    background:var(--white); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10; padding:14px 16px;
  }
  .header-inner{
    max-width:var(--shell-w); margin:0 auto;
    display:flex; justify-content:space-between; align-items:center; gap:16px;
  }
  .brand{font-size:20px; font-weight:900; color:var(--accent-dark); display:flex; align-items:center; gap:8px;}
  
  .search-box{
    flex:1; max-width:500px; position:relative;
  }
  .search-box input{
    width:100%; background:var(--gray-light); border:1px solid var(--line-strong);
    padding:10px 16px; border-radius:20px; font-family:inherit; font-size:14px; outline:none;
  }
  .search-box input:focus{border-color:var(--accent);}

  .main-container{max-width:var(--shell-w); margin:24px auto; padding:0 16px;}
  
  .disclaimer-banner{
    background:#fef3c7; border:1px solid #fde68a; color:#92400e;
    padding:10px 16px; border-radius:12px; font-size:12.5px; font-weight:700;
    margin-bottom:24px; text-align:center;
  }

  .products-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px;
  }

  .med-card{
    background:var(--white); border-radius:16px; border:1px solid var(--line);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .med-card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,0.06);}

  .med-img{
    aspect-ratio:1; width:100%; background:var(--gray-light);
    object-fit:cover; border-bottom:1px solid var(--line);
  }

  .med-body{padding:14px; flex:1; display:flex; flex-direction:column; justify-content:space-between;}
  
  .stock-tag{
    position:absolute; top:10px; right:10px; font-size:11px; font-weight:800;
    padding:4px 8px; border-radius:6px; z-index:2;
  }
  .stock-tag.in{background:#dcfce7; color:var(--in-stock);}
  .stock-tag.out{background:#fee2e2; color:var(--out-stock);}

  .trade-name{font-size:16px; font-weight:900; margin-bottom:2px; color:var(--black);}
  
  /* تمييز الاسم العلمي */
  .scientific-name{
    font-size:12px; font-weight:700; color:var(--accent-dark);
    background:#f0fdf4; padding:3px 6px; border-radius:4px;
    display:inline-block; margin-bottom:8px; width:fit-content;
  }

  .med-details{font-size:12px; color:var(--gray); margin-bottom:12px; line-height:1.6;}
  .med-details span{display:inline-block; margin-left:8px; font-weight:600;}

  .card-footer{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:10px; border-top:1px dashed var(--line); margin-top:auto;
  }
  .price{font-size:16px; font-weight:900; color:var(--black);}
  
  .buy-btn{
    background:var(--accent); color:var(--white); border:none;
    padding:8px 14px; border-radius:8px; font-weight:800; font-size:12.5px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  }
  .buy-btn.disabled{
    background:var(--gray-light); color:var(--gray); cursor:not-allowed;
  }

  .loading-box{text-align:center; padding:40px; color:var(--gray); font-weight:700; grid-column:1/-1;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">💊 صيدليتي</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث بالاسم التجاري أو الاسم العلمي (مثل: بندول أو Paracetamol)...">
    </div>
  </div>
</header>

<div class="main-container">

  <!-- إخلاء مسؤولية طبية -->
  <div class="disclaimer-banner">
    ⚠️ تنبيه طبي: المعلومات المعروضة للتعريف بالمنتج فقط، لا تقم بصرف أي دواء إلا بناءً على وصفة طبية أو إرشادات الصيدلي.
  </div>

  <div class="products-grid" id="productsGrid">
    <div class="loading-box">جاري تحميل الأدوية المتاحة...</div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzLZxIGum-QQ4vEvGsaozAqDQDyUiW54k",
  authDomain: "as12-d6210.firebaseapp.com",
  projectId: "as12-d6210",
  storageBucket: "as12-d6210.firebasestorage.app",
  messagingSenderId: "490183773270",
  appId: "1:490183773270:web:d8a8ff4be981d20f0afff7"
};

// رقم الهاتف لإرسال طلبات الواتساب (قم بتغييره برقم الصيدلية)
const PHARMACY_WHATSAPP = "218900000000";

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allProductsList = [];

// جلب الأدوية من قاعدة البيانات
db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
  allProductsList = [];
  snap.forEach(doc => {
    allProductsList.push({ id: doc.id, ...doc.data() });
  });
  renderProducts(allProductsList);
});

function renderProducts(list) {
  const grid = document.getElementById('productsGrid');
  
  if (list.length === 0) {
    grid.innerHTML = '<div class="loading-box">لم يتم العثور على أدوية مطابقة للبحث.</div>';
    return;
  }

  grid.innerHTML = list.map(item => {
    const isAvailable = item.inStock !== false;
    const imgUrl = (item.imageUrls && item.imageUrls[0]) || 'https://via.placeholder.com/300x300?text=No+Image';
    
    // إعداد نص الطلب للواتساب
    const waText = encodeURIComponent(`مرحباً صيدليتي، أرغب في طلب الدواء التالي:\n- الاسم التجاري: ${item.title || ''}\n- الاسم العلمي: ${item.scientific || 'غير محدد'}\n- التركيز: ${item.strength || 'غير محدد'}\n- العبوة: ${item.packSize || ''}\n- السعر: ${item.price} د.ل`);
    const waLink = `https://wa.me/${PHARMACY_WHATSAPP}?text=${waText}`;

    return `
      <div class="med-card">
        <span class="stock-tag ${isAvailable ? 'in' : 'out'}">
          ${isAvailable ? 'متوفر' : 'غير متوفر'}
        </span>
        <img src="${imgUrl}" alt="${item.title}" class="med-img" loading="lazy">
        
        <div class="med-body">
          <div>
            <div class="trade-name">${item.title || 'بدون اسم تجاري'}</div>
            ${item.scientific ? `<div class="scientific-name">🔬 ${item.scientific}</div>` : ''}
            
            <div class="med-details">
              ${item.strength ? `<div>التركيز: <span>${item.strength}</span></div>` : ''}
              ${item.packSize ? `<div>الحجم/العبوة: <span>${item.packSize}</span></div>` : ''}
              ${item.manufacturer ? `<div>الشركة: <span>${item.manufacturer}</span></div>` : ''}
            </div>
          </div>

          <div class="card-footer">
            <div class="price">${item.price} <small style="font-size:11px;">د.ل</small></div>
            ${isAvailable 
              ? `<a href="${waLink}" target="_blank" class="buy-btn">طلب الدواء 💬</a>`
              : `<button class="buy-btn disabled" disabled>نفذت الكمية</button>`
            }
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// خاصية البحث السريع في الاسم التجاري والعلمي معاً
document.getElementById('searchInput').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase().trim();
  
  const filtered = allProductsList.filter(p => {
    const tradeMatch = (p.title || '').toLowerCase().includes(term);
    const scientificMatch = (p.scientific || '').toLowerCase().includes(term);
    const manufacturerMatch = (p.manufacturer || '').toLowerCase().includes(term);
    
    return tradeMatch || scientificMatch || manufacturerMatch;
  });

  renderProducts(filtered);
});
</script>
</body>
</html>
